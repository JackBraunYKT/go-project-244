name: ci
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  check:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Go version
        run: go version

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: tests
        run: make test

      - name: build
        run: make build
