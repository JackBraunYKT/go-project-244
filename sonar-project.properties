sonar.projectKey=JackBraunYKT_go-project-244
sonar.organization=jackbraunykt

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Lang
sonar.language=go

# Test Configuration
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/testdata/**

# Excluded Files from Analysis
sonar.exclusions=**/*_test.go,**/testdata/**

# Coverage Settings
sonar.coverage.exclusions=**/cmd/**,**/testdata/**
sonar.go.coverage.reportPaths=coverage.out